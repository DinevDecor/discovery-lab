name: C3 Capability Observatory

# Slice 02, 30-day experimental trial. workflow_dispatch ONLY -- no cron.
# Capture (fetching provider pages) is human/AI-executor-driven and happens
# OUTSIDE this workflow; submissions are committed to
# capability-observatory/incoming/ beforehand. This job only validates,
# normalizes, and records what was already submitted, then renders the
# weekly report. It never fetches anything itself.
#
# Structurally independent of constraint-archaeology-daily.yml: its own
# trigger, its own concurrency group, its own paths. It never touches
# constraint-archaeology-agents/.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note for this run (e.g. "week of 2026-08-16")'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: capability-observatory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run C3 unit tests
        working-directory: capability-observatory
        run: python3 -m unittest discover -s tests -v

      - name: Process submitted captures and render weekly report
        working-directory: capability-observatory
        run: python3 run_capability_observatory.py process

      - name: Commit evidence and report
        run: |
          git config user.name "capability-observatory-bot"
          git config user.email "capability-observatory-bot@users.noreply.github.com"
          git add capability-observatory/data capability-observatory/reports capability-observatory/incoming
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Process C3 capability-observatory captures"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
