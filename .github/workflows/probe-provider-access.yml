name: Probe Provider Access

on:
  push:
    branches:
      - probe/github-runner-provider-access
    paths:
      - .github/workflows/probe-provider-access.yml

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/probe/github-runner-provider-access'
    runs-on: ubuntu-latest
    steps:
      - name: Probe provider endpoints
        shell: bash
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, socket
          urls = [
              'https://api.digikey.com/',
              'https://api.mouser.com/',
              'https://www.digikey.com/',
              'https://www.mouser.com/',
              'https://www.automationdirect.com/',
          ]
          for url in urls:
              print(f'=== {url} ===')
              req = urllib.request.Request(url, headers={'User-Agent':'reality-observatory-access-probe/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      print('NETWORK_OK', 'status=', r.status, 'final_url=', r.geturl())
              except urllib.error.HTTPError as e:
                  print('NETWORK_OK_HTTP_ERROR', 'status=', e.code, 'final_url=', e.geturl())
              except Exception as e:
                  print('NETWORK_FAIL', type(e).__name__, str(e))
          PY
