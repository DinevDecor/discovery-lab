name: Test Pack v1 - Production Judge (isolated, temporary push trigger)

# TEMPORARY trigger. workflow_dispatch cannot be used here: GitHub only
# activates workflow_dispatch for files that already exist on the default
# branch, and this workflow intentionally never lands on main. So this is
# triggered by push, scoped as tightly as possible:
#   - only the Test Pack branch (see branches: below, and the job-level
#     github.ref guard, which is a second, redundant safety check)
#   - only paths under evaluation/test-pack-v1/** or this file itself
#   - no schedule, no pull_request
# Once the production-judge run has been captured, this trigger is reverted
# back to workflow_dispatch-only (functionally inert, since it is still
# never registered on main) in a follow-up commit, so later edits under
# evaluation/test-pack-v1/ do not keep re-firing it.
#
# Runs the frozen Constraint Archaeology Test Pack v1
# (evaluation/test-pack-v1/) through the real production ClaudeMechanismJudge,
# reusing the same ANTHROPIC_API_KEY secret the daily pipeline already uses.
#
# Scope is deliberately narrow: this workflow only ever writes
# evaluation/test-pack-v1/results-production-judge.json, and only ever
# commits to the Test Pack branch, never main. It does not run
# run_daily.py, does not touch constraint-archaeology-agents/data/ or
# reports/, does not modify same_mechanism_gate.py or any frozen document,
# and is independent of constraint-archaeology-daily.yml.

on:
  push:
    branches:
      - claude/constraint-archaeology-test-pack-n4xmv4
    paths:
      - 'evaluation/test-pack-v1/**'
      - '.github/workflows/test-pack-v1-production-judge.yml'

permissions:
  contents: write

jobs:
  run-production-judge:
    # Second guard: the results-commit step below pushes back to this same
    # branch under evaluation/test-pack-v1/**, which would otherwise
    # re-trigger this very workflow on its own output and re-run the real
    # API experiment in a loop. Skip if the triggering commit is that
    # self-commit (identified by its exact, fixed message).
    if: >-
      github.ref == 'refs/heads/claude/constraint-archaeology-test-pack-n4xmv4' &&
      !startsWith(github.event.head_commit.message, 'Test Pack v1: production ClaudeMechanismJudge run')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run frozen regression fixtures (sanity check only, no changes made)
        working-directory: constraint-archaeology-agents
        run: python3 -m unittest discover -s tests -v

      - name: Run Test Pack v1 against production ClaudeMechanismJudge
        working-directory: evaluation/test-pack-v1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 run_test_pack_production.py

      - name: Commit production-judge results (this file only)
        run: |
          git config user.name "test-pack-v1-bot"
          git config user.email "test-pack-v1-bot@users.noreply.github.com"
          git add evaluation/test-pack-v1/results-production-judge.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Test Pack v1: production ClaudeMechanismJudge run"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
