name: Constraint Archaeology Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        working-directory: constraint-archaeology-agents
        run: python3 -m unittest discover -s tests -v
      - name: Run daily pipeline
        working-directory: constraint-archaeology-agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 run_daily.py
      - name: Commit generated evidence and report
        run: |
          git config user.name "constraint-archaeology-bot"
          git config user.email "constraint-archaeology-bot@users.noreply.github.com"
          git add constraint-archaeology-agents/data constraint-archaeology-agents/reports
          git diff --cached --quiet && exit 0
          git commit -m "Update Constraint Archaeology daily evidence"
          git push
