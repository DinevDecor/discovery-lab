name: Constraint Archaeology Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: write

concurrency:
  group: constraint-archaeology-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        working-directory: constraint-archaeology-agents
        run: python3 -m unittest discover -s tests -v
      - name: Run daily pipeline
        working-directory: constraint-archaeology-agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 run_daily.py
      - name: Commit generated evidence and report
        run: |
          git config user.name "constraint-archaeology-bot"
          git config user.email "constraint-archaeology-bot@users.noreply.github.com"
          git add constraint-archaeology-agents/data constraint-archaeology-agents/reports
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Update Constraint Archaeology daily evidence"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
