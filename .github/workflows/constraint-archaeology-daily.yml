name: Constraint Archaeology Daily

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: write

concurrency:
  group: constraint-archaeology-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Constraint Archaeology unit tests
        working-directory: constraint-archaeology-agents
        run: python3 -m unittest discover -s tests -v
      - name: Run Business Candidate Analyst unit tests
        working-directory: business-candidate-analyst
        run: python3 -m unittest discover -s tests -v
      - name: Run pipeline orchestrator tests
        run: python3 -m unittest tests.test_daily_pipeline -v
      - name: Run daily pipeline (Constraint Archaeology -> Business Candidate Analyst)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
        run: python3 run_daily_pipeline.py
      - name: Commit generated evidence and reports
        run: |
          git config user.name "constraint-archaeology-bot"
          git config user.email "constraint-archaeology-bot@users.noreply.github.com"
          git add constraint-archaeology-agents/data constraint-archaeology-agents/reports \
                  business-candidate-analyst/data business-candidate-analyst/reports \
                  reports
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Update daily Constraint Archaeology and Business Candidate Analyst evidence"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
