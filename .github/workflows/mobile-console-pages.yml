name: Mobile Machine Console — Pages Deploy

# Publishes mobile-console/site/ (a static, read-only, serverless viewer —
# see mobile-console/CONTRACT.md) to GitHub Pages. This workflow is glue
# only: it checks out the repository, rebuilds the snapshot from the real
# ledgers already in this repo, and uploads the static site as a Pages
# artifact. It never writes to any other package's data, calls a model, or
# mutates anything — the site it deploys is structurally incapable of
# writing anywhere (mobile-console/tests/test_safety.py
# ::NoMutationSurfaceInSiteTests).
#
# This repo has never had Pages enabled. The "Set up Pages" step below
# passes enablement: true, so actions/configure-pages attempts to enable
# it via the Pages API itself (available to a write-access token on a
# public repo, no manual Settings step required). If that ever stops
# working — e.g. the repo goes private — enable Pages once by hand under
# Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "mobile-console/**"
      - ".github/workflows/mobile-console-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build snapshot + package site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout discovery-lab
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run mobile-console tests (offline, deterministic)
        working-directory: mobile-console
        run: python3 -m unittest discover -s tests -v

      - name: Rebuild the real snapshot from canonical ledgers
        working-directory: mobile-console
        run: python3 run_mobile_console.py build

      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          # This repo has never had Pages enabled before. On a public repo,
          # a user/token with write access can enable it via the Pages API
          # directly, so let the action attempt that instead of only
          # verifying a site that doesn't exist yet.
          enablement: true

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile-console/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
