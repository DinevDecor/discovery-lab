name: Finish Claude discovery-lab bundle

on:
  push:
    branches:
      - claude/reality-observatory-slice-01

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install only missing bundle files
        shell: bash
        run: |
          set -euo pipefail
          test -f discovery-lab-bundle.tar.gz
          rm -rf /tmp/discovery-bundle
          mkdir -p /tmp/discovery-bundle
          tar -xzf discovery-lab-bundle.tar.gz -C /tmp/discovery-bundle --strip-components=1

          # The integrated gate and its regression fixtures already live in the
          # working package under src/ca_agents and constraint-archaeology-agents/tests.
          # Keep those authoritative versions; do not add the package-level duplicates.
          rm -f /tmp/discovery-bundle/constraint-archaeology-agents/same_mechanism_gate.py
          rm -f /tmp/discovery-bundle/tests/test_same_mechanism_gate.py

          while IFS= read -r f; do
            rel="${f#/tmp/discovery-bundle/}"
            if git ls-files --error-unmatch "$rel" >/dev/null 2>&1; then
              echo "Keeping existing tracked file: $rel"
            else
              mkdir -p "$(dirname "$rel")"
              cp "$f" "$rel"
              echo "Installed missing file: $rel"
            fi
          done < <(find /tmp/discovery-bundle -type f | sort)

          # Remove bootstrap-only artifacts and the duplicate gate previously staged.
          rm -f constraint-archaeology-agents/same_mechanism_gate.py
          rm -f discovery-lab-bundle.tar.gz

      - name: Run validation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=constraint-archaeology-agents python tests/test_findings_ledger.py
          (cd constraint-archaeology-agents && python3 -m unittest discover -s tests -v)

      - name: Commit completed installation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/install-discovery-bundle.yml
          git config user.name "constraint-archaeology-bot"
          git config user.email "constraint-archaeology-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No installation changes remain."
            exit 0
          fi
          git commit -m "docs: complete Reality Observatory bundle installation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
