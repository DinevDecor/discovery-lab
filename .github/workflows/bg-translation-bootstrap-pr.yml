name: Bulgarian Translation Bootstrap — Observable

# Temporary one-time bootstrap path used only to make the first translation
# run observable through a pull-request workflow. It never writes to main
# directly; a successful cache is committed only to this same PR branch.

on:
  pull_request:
    paths:
      - ".github/workflows/bg-translation-bootstrap-pr.yml"
      - "mobile-console/**"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  TRANSLATION_MODEL: gpt-4.1-mini

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/bg-bootstrap-observable
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require translation secret
        run: test -n "$OPENAI_API_KEY" || (echo "OPENAI_API_KEY secret is missing" && exit 1)

      - name: Generate Bulgarian display cache
        run: python3 mobile-console/scripts/update_bg_translations.py

      - name: Run mobile-console tests
        working-directory: mobile-console
        run: python3 -m unittest discover -s tests -v

      - name: Upload generated cache
        uses: actions/upload-artifact@v4
        with:
          name: bg-translations-bootstrap
          path: mobile-console/site/translations-bg.json
          if-no-files-found: error

      - name: Commit cache to bootstrap branch
        shell: bash
        run: |
          git config user.name "mobile-console-translation-bot"
          git config user.email "mobile-console-translation-bot@users.noreply.github.com"
          git add mobile-console/site/translations-bg.json
          git commit -m "chore: seed Bulgarian mobile translations [skip ci]"
          git push origin HEAD:chatgpt/bg-bootstrap-observable
