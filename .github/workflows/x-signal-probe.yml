name: X Signal Probe (daily, bounded)

# Daily, bounded X Signal Probe run - see x-signal-probe/CONTRACT.md and
# README.md. A human has reviewed a successful bounded manual run (Run 1),
# so this is now scheduled - workflow_dispatch stays available too, for
# on-demand runs.
#
# Scheduled at 21:00 UTC, one hour before Constraint Archaeology Daily's
# own 22:00 UTC cron (constraint-archaeology-daily.yml). There is
# currently no code path from this probe's ledger into Constraint
# Archaeology or Business Candidate Analyst - see CONTRACT.md's "X -> CA
# Bridge" section for why the bridge is deliberately not built yet - so
# today this ordering has no functional effect. It's set anyway so that
# if the bridge is ever approved later, the cadence never needs to change.
#
# Commits ONLY this package's own durable, text-free ledger and report -
# x-signal-probe/data/ and x-signal-probe/reports/ - the same pattern
# constraint-archaeology-daily.yml uses for its own data, scoped to this
# package's paths only. Entirely separate workflow: this never runs the
# daily CA/BCA pipeline, and a failure here can never break it.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 21 * * *'

permissions:
  contents: write

concurrency:
  group: x-signal-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Run X Signal Probe (bounded, read-only against X)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout discovery-lab
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run X Signal Probe offline unit tests
        working-directory: x-signal-probe
        run: python3 -m unittest discover -s tests -v

      - name: Run bounded probe (see CONTRACT.md for the fixed bounds)
        working-directory: x-signal-probe
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python3 run_x_signal_probe.py

      - name: Commit X Signal Probe ledger and report (X-owned paths only)
        run: |
          git config user.name "x-signal-probe-bot"
          git config user.email "x-signal-probe-bot@users.noreply.github.com"
          git add x-signal-probe/data x-signal-probe/reports
          if git diff --cached --quiet; then
            echo "No new ledger rows or report changes to commit."
            exit 0
          fi
          git commit -m "Update X Signal Probe ledger and report"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
