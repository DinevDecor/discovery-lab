<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Machine Console</title>
<meta name="description" content="A read-only mobile console over discovery-lab's real ledgers: opportunities, pipeline, ground truth, and activity.">
<meta name="theme-color" content="#33456B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Machine Console">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,ital@9..144,400..700,0..1&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar" id="topbar">
    <div class="eyebrow" id="eyebrow">discovery-lab · machine console</div>
    <h1 id="screen-title">Machine Console</h1>
  </div>

  <main class="screen" id="screen" aria-live="polite">
    <div class="loading">loading real ledger data…</div>
  </main>

  <nav class="bottomnav" aria-label="Primary">
    <button class="navbtn" data-route="home" aria-current="page">
      <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
      HOME
    </button>
    <button class="navbtn" data-route="opportunities">
      <svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="1.5"/><path d="M9 7V5.5A2.5 2.5 0 0 1 11.5 3h1A2.5 2.5 0 0 1 15 5.5V7"/></svg>
      OPPORTUNITIES
    </button>
    <button class="navbtn" data-route="pipeline">
      <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
      PIPELINE
    </button>
    <button class="navbtn" data-route="ground-truth">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.6"/></svg>
      GROUND TRUTH
    </button>
    <button class="navbtn" data-route="activity">
      <svg viewBox="0 0 24 24"><path d="M4 12h4l2 7 4-14 2 7h4"/></svg>
      ACTIVITY
    </button>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
